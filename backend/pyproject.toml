[project]
name = "min-ledger-agent"
version = "0.1.0"
description = "Mini Ledger Agent - 可澄清、可追溯的智能记账助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=11.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "sqlalchemy[asyncio]>=2.0.36",
    "tenacity>=9.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
