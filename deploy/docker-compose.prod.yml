name: min-ledger

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: ${DB_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ayfwq/min-ledger-backend:latest}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ledger}
      UPLOAD_DIR: /app/data/uploads
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    image: ${WEB_IMAGE:-ghcr.io/ayfwq/min-ledger-web:latest}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    logging: *default-logging
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - backend
    networks:
      - internal

volumes:
  pgdata:
  uploads:

networks:
  internal:
    driver: bridge
