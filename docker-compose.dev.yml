name: min-ledger-dev

services:
  db:
    image: postgres:16-alpine
    container_name: min-ledger-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - '5433:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
